<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Imagery & Surfaces" subtitle="Oil-droplet hero · yellow · canvas" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/mona-sans@latest/index.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}body{padding:0;display:flex}
  .panel{flex:1;height:200px;display:flex;align-items:flex-end;padding:16px;box-sizing:border-box}
  .a{background:var(--brand-yellow);background-image:url(../assets/oil-droplet-bg.png);background-size:cover;background-position:center}
  .b{background:var(--brand-yellow)}
  .c{background:#fff;border:1px solid var(--border)}
  .cap{font-family:var(--font-ui);font-weight:600;font-size:12px;color:var(--brand-ink);background:rgba(255,255,255,.6);padding:3px 8px;border-radius:6px}
  .c .cap{background:var(--gray-100);color:var(--gray-700)}
</style>
</head>
<body>
  <div class="panel a"><span class="cap">Oil-droplet hero / sidebar watermark</span></div>
  <div class="panel b"><span class="cap">#FFD800 flat fill</span></div>
  <div class="panel c"><span class="cap">#F6F8FA canvas → white cards</span></div>
</body>
</html>
