<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo / Apex Mark" subtitle="On light, yellow, blue" viewport="700x120" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/mona-sans@latest/index.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}body{background:#fff;padding:26px;display:flex;align-items:center;gap:40px}
  .lockup{display:flex;align-items:center;gap:12px}
  .lockup img{width:48px;height:48px}
  .name{font-family:var(--font-head);font-weight:800;font-size:22px;color:var(--gray-900);line-height:1}
  .name span{display:block;font-family:var(--font-ui);font-weight:500;font-size:13px;color:var(--gray-500)}
  .onblue{background:var(--brand-blue);padding:18px 22px;border-radius:var(--radius-lg)}
  .onblue .name{color:#fff}.onblue .name span{color:rgba(255,255,255,.75)}
  .onyellow{background:var(--brand-yellow);padding:18px 22px;border-radius:var(--radius-lg)}
</style>
</head>
<body>
  <div class="lockup">
    <img src="../assets/logo/gcb-logo.svg" alt="GCB logo">
    <div class="name">BISTA HR<span>Workforce Management</span></div>
  </div>
  <div class="lockup onyellow"><img src="../assets/logo/gcb-logo.svg" alt="GCB logo"><div class="name">BISTA HR</div></div>
  <div class="lockup onblue"><img src="../assets/logo/gcb-logo.svg" alt="GCB logo" style="background:#fff;border-radius:12px;padding:5px;box-sizing:content-box;width:40px;height:40px"><div class="name">BISTA HR</div></div>
</body>
</html>
