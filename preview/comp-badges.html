<!DOCTYPE html>
<!-- @dsCard group="Components" name="Status Pills & Dots" subtitle="Pending/Completed/Failed + Active/Inactive" viewport="700x130" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../bista-components.css">
<style>html,body{margin:0}body{background:#fff;padding:26px;display:flex;flex-direction:column;gap:18px}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}</style>
</head>
<body>
  <div class="row">
    <span class="pill pill-pending"><i class="ri-time-fill"></i>Pending</span>
    <span class="pill pill-completed"><i class="ri-checkbox-circle-fill"></i>Completed</span>
    <span class="pill pill-failed"><i class="ri-close-circle-fill"></i>Failed</span>
  </div>
  <div class="row">
    <span class="status status-active">Active</span>
    <span class="status status-inactive">Inactive</span>
  </div>
</body>
</html>
