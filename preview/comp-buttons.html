<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Yellow CTA · blue · stroke · ghost · danger" viewport="700x150" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/mona-sans@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../bista-components.css">
<style>html,body{margin:0}body{background:#fff;padding:24px;display:flex;flex-direction:column;gap:14px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}</style>
</head>
<body>
  <div class="row">
    <button class="btn btn-primary">Create Job Grade</button>
    <button class="btn btn-blue"><i class="ri-add-line"></i>Close Posting</button>
    <button class="btn btn-stroke">Cancel</button>
    <button class="btn btn-ghost">Privacy Policy</button>
    <button class="btn btn-danger">Yes, Archive</button>
  </div>
  <div class="row">
    <button class="btn btn-primary btn-sm">Continue</button>
    <button class="btn btn-stroke btn-sm"><i class="ri-filter-3-line"></i>Show Filter</button>
    <button class="btn btn-stroke btn-icon"><i class="ri-more-2-fill"></i></button>
    <button class="btn btn-blue" disabled>Disabled</button>
    <button class="btn btn-primary"><i class="ri-arrow-right-s-line"></i></button>
  </div>
</body>
</html>
