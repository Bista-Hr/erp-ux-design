<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">

<style>html,body{margin:0}body{background:#fff;padding:24px;display:flex;gap:20px}.field{flex:1}</style>
</head>
<body>
  <div class="field">
    <label>Organization Domain</label>
    <div class="input-wrap"><i class="ri-building-line"></i><input placeholder="eg. Starett-ltd"><i class="ri-information-line" style="color:var(--gray-300)"></i></div>
    <span class="hint">This is the domain used to sign in.</span>
  </div>
  <div class="field">
    <label>Description <span class="opt">(optional)</span></label>
    <div class="input-wrap"><textarea placeholder="Enter description"></textarea></div>
  </div>
</body>
