<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Horizontal Tabs" subtitle="Sub-menu tab bar on white, gold active underline" viewport="960x240" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../bista-components.css">
<style>
  html,body{margin:0;background:#ffffff !important}
  body{padding:0;min-height:100vh}
  .surface{background:#ffffff;min-height:100vh;box-sizing:border-box;padding:32px 32px 0;border-bottom:1px solid var(--border)}
  .hint{font-family:var(--font-ui);font-size:13px;color:var(--gray-400);margin:28px 4px 0;max-width:640px}
</style>
</head>
<body>
  <div class="surface">
    <div class="tabs">
      <button class="tab">Employee</button>
      <button class="tab active">Departments</button>
      <button class="tab">Job Grades</button>
      <button class="tab">Zones</button>
      <button class="tab">Job Titles</button>
      <button class="tab">Units/ Branches</button>
      <button class="tab">Approvals</button>
    </div>
    <p class="hint">Sub-section navigation. Sits on a solid white surface (same as the header) above the content card. Active tab uses gold text + a gold underline.</p>
  </div>
</body>
</html>
