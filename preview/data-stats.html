<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/mona-sans@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">

<link rel="stylesheet" href="ds-card.css">

</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/primitives/controls.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/primitives/ui.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/primitives/status-badge.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/primitives/empty-state.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/primitives/FileIcon.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/primitives/PageHeader.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/forms/Combobox.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/forms/StatusFilter.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/forms/SupportingDocsUploader.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/forms/MultiImageDropZone.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/forms/SupportingDocuments.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/overlays/Modal.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/overlays/ConfirmModal.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/overlays/Drawer.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/overlays/RejectionReasonModal.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/overlays/Toast.jsx"></script>
  <script type="text/babel">
const { useState } = React;
function Spec({label, children}) { return (<div className="spec"><div className="spec-label">{label}</div><div className="spec-row">{children}</div></div>); }
function SpecCol({label, children}) { return (<div className="spec"><div className="spec-label">{label}</div><div className="spec-col">{children}</div></div>); }

function Demo(){
  const [q,setQ]=useState({text:'How many years of operations experience do you have?',type:0});
  const stats=[['Total Postings','24'],['Open','8'],['Applicants','312'],['Shortlisted','41'],['Hired','6']];
  return (<div className="page">
    <SpecCol label="StatCard" >
      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:14,maxWidth:'100%',width:'100%'}}>
        {stats.map(([t,v],i)=><UI.StatCard key={t} title={t} value={v} index={i} />)}
      </div>
    </SpecCol>
    <SpecCol label="QuestionItem (pre-screening)">
      <div style={{width:'100%',maxWidth:'100%'}}><UI.QuestionItem question={q} index={0} onChange={(f,v)=>setQ(s=>({...s,[f]:v}))} onRemove={()=>{}} /></div>
    </SpecCol>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>
