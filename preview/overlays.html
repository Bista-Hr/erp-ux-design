<head>

<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

  <script type="text/babel" src="../ui_kits/bista-hr/src/primitives/empty-state.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/primitives/FileIcon.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/primitives/PageHeader.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/forms/Combobox.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/forms/StatusFilter.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/forms/SupportingDocsUploader.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/forms/MultiImageDropZone.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/forms/SupportingDocuments.jsx"></script>

  <script type="text/babel" src="../ui_kits/bista-hr/src/overlays/ConfirmModal.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/overlays/Drawer.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/overlays/RejectionReasonModal.jsx"></script>
  <script type="text/babel" src="../ui_kits/bista-hr/src/overlays/Toast.jsx"></script>
  <script type="text/babel">
const { useState } = React;
function Spec({label, children}) { return (<div className="spec"><div className="spec-label">{label}</div><div className="spec-row">{children}</div></div>); }
function SpecCol({label, children}) { return (<div className="spec"><div className="spec-label">{label}</div><div className="spec-col">{children}</div></div>); }

function Demo(){
  const [open,setOpen]=useState(null);
  return (<div className="page">
    <Spec label="Triggers">
      <Button variant="stroke" onClick={()=>setOpen('modal')}>Open Modal</Button>
      <Button variant="stroke" onClick={()=>setOpen('confirm')}>Confirm Modal</Button>
      <Button variant="stroke" onClick={()=>setOpen('reject')}>Rejection Reason</Button>
      <Button variant="stroke" onClick={()=>setOpen('drawer')}>Drawer</Button>
    </Spec>
    {open==='modal' && <Modal onClose={()=>setOpen(null)} width={460}><div style={{padding:24}}><div className="bh-h2" style={{fontSize:18}}>Modal title</div><div className="bh-body" style={{marginTop:6}}>A dimmed backdrop + centered card shell. Click outside to close.</div><div style={{display:'flex',justifyContent:'flex-end',gap:12,marginTop:20}}><Button variant="stroke" onClick={()=>setOpen(null)}>Cancel</Button><Button variant="primary" onClick={()=>setOpen(null)}>Continue</Button></div></div></Modal>}
    {open==='confirm' && <ConfirmModal title="Archive Job Grade" message="Are you sure you want to archive this job grade?" confirmLabel="Yes, Archive" confirmIcon="archive-line" onConfirm={()=>setOpen(null)} onClose={()=>setOpen(null)} />}
    <RejectionReasonModal open={open==='reject'} onClose={()=>setOpen(null)} onConfirm={()=>setOpen(null)} noun="promotion" />
    <Drawer open={open==='drawer'} onClose={()=>setOpen(null)} title="Request Details" icon="file-list-3-line"><div className="bh-body">A right-side sheet that slides in. Use for read-only detail panels.</div></Drawer>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>
