<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Elevation" subtitle="Border-first; shadow reserved for overlays" viewport="700x170" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--gray-75);padding:26px}
  .row{display:flex;gap:22px}
  .it{flex:1;display:flex;flex-direction:column;gap:10px;align-items:center}
  .bx{width:100%;height:64px;background:#fff;border-radius:var(--radius-lg)}
  .nm{font-family:var(--font-head);font-weight:700;font-size:12px;color:var(--text-primary)}
  .vl{font-family:var(--font-control);font-size:10px;color:var(--text-muted);text-align:center}
</style>
</head>
<body>
  <div class="row">
    <div class="it"><div class="bx" style="border:1px solid var(--border)"></div><div class="nm">Card</div><div class="vl">1px border + faint shadow</div></div>
    <div class="it"><div class="bx" style="box-shadow:var(--shadow-input);border:1px solid var(--border-strong)"></div><div class="nm">Input</div><div class="vl">hairline 1–2px shadow</div></div>
    <div class="it"><div class="bx" style="box-shadow:var(--shadow-pop)"></div><div class="nm">Popover</div><div class="vl">dropdowns · menus</div></div>
    <div class="it"><div class="bx" style="box-shadow:var(--shadow-modal);border-radius:var(--radius-xl)"></div><div class="nm">Modal</div><div class="vl">0 16 32 -12 / .10</div></div>
  </div>
</body>
</html>
