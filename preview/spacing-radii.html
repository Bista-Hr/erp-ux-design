<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Corner Radii" subtitle="6 · 8 · 10 · 12 · 16 · full" viewport="700x160" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--white);padding:24px}
  .row{display:flex;gap:18px;align-items:flex-end}
  .it{display:flex;flex-direction:column;gap:8px;align-items:center}
  .bx{width:78px;height:64px;background:var(--brand-yellow-tint);border:1.5px solid var(--brand-yellow-dark)}
  .nm{font-family:var(--font-head);font-weight:700;font-size:12px;color:var(--text-primary)}
  .vl{font-family:var(--font-control);font-size:11px;color:var(--text-muted)}
  .it span{text-align:center;line-height:1.3}
</style>
</head>
<body>
  <div class="row">
    <div class="it"><div class="bx" style="border-radius:var(--radius-xs)"></div><span class="nm">xs · 6px<br><span class="vl">pills · toast</span></span></div>
    <div class="it"><div class="bx" style="border-radius:var(--radius-sm)"></div><span class="nm">sm · 8px<br><span class="vl">nav item</span></span></div>
    <div class="it"><div class="bx" style="border-radius:var(--radius-md)"></div><span class="nm">md · 10px<br><span class="vl">button · input</span></span></div>
    <div class="it"><div class="bx" style="border-radius:var(--radius-lg)"></div><span class="nm">lg · 12px<br><span class="vl">media card</span></span></div>
    <div class="it"><div class="bx" style="border-radius:var(--radius-xl)"></div><span class="nm">xl · 16px<br><span class="vl">modal</span></span></div>
    <div class="it"><div class="bx" style="border-radius:var(--radius-full)"></div><span class="nm">full<br><span class="vl">avatar · dot</span></span></div>
  </div>
</body>
</html>
