<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing Scale" subtitle="4px base grid" viewport="700x240" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--white);padding:24px}
  .r{display:flex;align-items:center;gap:14px;padding:6px 0}
  .bar{height:18px;background:var(--brand-yellow);border-radius:3px}
  .nm{flex:0 0 70px;font-family:var(--font-head);font-weight:700;font-size:12px;color:var(--text-primary)}
  .vl{font-family:var(--font-control);font-size:11px;color:var(--text-muted)}
</style>
</head>
<body>
  <div class="r"><span class="nm">1 · 4</span><div class="bar" style="width:4px"></div><span class="vl">icon ↔ label gap</span></div>
  <div class="r"><span class="nm">2 · 8</span><div class="bar" style="width:8px"></div><span class="vl">nav item gap</span></div>
  <div class="r"><span class="nm">3 · 12</span><div class="bar" style="width:12px"></div><span class="vl">button group gap</span></div>
  <div class="r"><span class="nm">4 · 16</span><div class="bar" style="width:16px"></div><span class="vl">card padding (sm)</span></div>
  <div class="r"><span class="nm">6 · 24</span><div class="bar" style="width:24px"></div><span class="vl">card / modal padding</span></div>
  <div class="r"><span class="nm">8 · 32</span><div class="bar" style="width:32px"></div><span class="vl">page gutter</span></div>
  <div class="r"><span class="nm">10 · 40</span><div class="bar" style="width:40px"></div><span class="vl">section gap</span></div>
</body>
</html>
