<!DOCTYPE html>
<!-- @dsCard group="Type" name="Typefaces" subtitle="Manrope · Mona Sans · Inter · Bricolage" viewport="700x300" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/mona-sans@latest/index.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--white);padding:24px}
  .fam{display:flex;flex-direction:column;gap:2px;padding:14px 0;border-bottom:1px solid var(--border)}
  .fam:last-child{border-bottom:0}
  .big{font-size:30px;color:var(--text-primary);line-height:1.1}
  .meta{display:flex;justify-content:space-between;align-items:baseline}
  .nm{font-family:var(--font-control);font-size:12px;font-weight:600;color:var(--text-primary)}
  .role{font-family:var(--font-control);font-size:11px;color:var(--text-muted)}
</style>
</head>
<body>
  <div class="fam">
    <div class="big" style="font-family:'Manrope';font-weight:700">Manrope · Workforce</div>
    <div class="meta"><span class="nm">Manrope — 400 / 500 / 600 / 700 / 800</span><span class="role">Primary UI · nav · body</span></div>
  </div>
  <div class="fam">
    <div class="big" style="font-family:'Mona Sans';font-weight:700">Mona Sans · Job Grades</div>
    <div class="meta"><span class="nm">Mona Sans — 400 / 500 / 600 / 700</span><span class="role">Headers · titles</span></div>
  </div>
  <div class="fam">
    <div class="big" style="font-family:'Inter';font-weight:500">Inter · Continue</div>
    <div class="meta"><span class="nm">Inter — 400 / 500 / 600</span><span class="role">Inputs · buttons</span></div>
  </div>
  <div class="fam">
    <div class="big" style="font-family:'Bricolage Grotesque';font-weight:700">Bricolage · Display</div>
    <div class="meta"><span class="nm">Bricolage Grotesque — 700 / 800</span><span class="role">Rare display</span></div>
  </div>
</body>
</html>
