  const _secScale = { 50: "hsl(0 100% 98% / <alpha-value>)", 100: "hsl(0 100% 95% / <alpha-value>)", 200: "hsl(0 100% 90% / <alpha-value>)", 300: "hsl(0 100% 80% / <alpha-value>)", 400: "hsl(0 100% 70% / <alpha-value>)", 500: "hsl(0 100% 60% / <alpha-value>)", 600: "hsl(0 100% 50% / <alpha-value>)", 700: "hsl(0 100% 40% / <alpha-value>)", 800: "hsl(0 100% 30% / <alpha-value>)", 900: "hsl(0 100% 20% / <alpha-value>)", 950: "hsl(0 100% 10% / <alpha-value>)", DEFAULT: "hsl(0 100% 60% / <alpha-value>)" };
  tailwind.config = {
    corePlugins: { preflight: false },

      "destructive-foreground": "#ffffff",
      card: "#ffffff", "card-foreground": "hsl(0 0% 14.5%)",
      background: "#ffffff", foreground: "hsl(0 0% 14.5%)",
      border: "hsl(0 0% 92%)", input: "hsl(0 0% 92%)", ring: "hsl(51 100% 46%)",

<style>
  /* preflight is off — replicate only Tailwind's border reset so `border` utilities work
     (default width 0) without forcing stray medium borders onto every element */
  *, ::before, ::after { border-width: 0; border-style: solid; border-color: var(--border); }
  /* preflight is off — reset the UA default button background (light gray) so Tailwind
     bg-* utilities (and transparent buttons) render correctly; .btn etc. set their own bg */
  button { background-color: transparent; background-image: none; }
  /* preflight is off — zero the UA default <p> margins (Tailwind-driven paragraphs rely on this;
     without it, native <p> margins inflate cards like the StatCard tiles) */

<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: var(--gray-75); }
  /* RichText (Quill-snow-like) placeholder + list rendering */
  .bh-rte:empty::before { content: attr(data-ph); color: var(--gray-400); pointer-events: none; }
  .bh-rte ul { list-style: disc; padding-left: 1.5em; margin: 0; }
  .bh-rte ol { list-style: decimal; padding-left: 1.5em; margin: 0; }
  .bh-rte a { color: var(--brand-blue); text-decoration: underline; }
  .bh-rte:focus { outline: none; }

  /* ---- Job Posts list: container-query responsive stats + table ---- */
  /* DOM order: stats first, then table. Small/medium container → flex column (stats stacked on top).
     Wide (2xl) container → flex row with the table; stats sit to the RIGHT via order. */
  .jp-split { display: flex; flex-direction: column; gap: 20px; }
  .jp-split > .jp-table { flex: 1 1 auto; min-width: 0; }
  .jp-split > .jp-stats { flex: none; container-type: inline-size; }
  .jp-stat-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @container (min-width: 380px) { .jp-stat-grid { grid-template-columns: repeat(2, 1fr); } }
  @container (min-width: 620px) { .jp-stat-grid { grid-template-columns: repeat(3, 1fr); } }
  @container (min-width: 900px) { .jp-stat-grid { grid-template-columns: repeat(5, 1fr); } }
  /* the split flips to row off the MAIN content width (.bh-main) at the 2xl (1280px) breakpoint */
  @container (min-width: 1280px) {
    .jp-split { flex-direction: row; align-items: flex-start; }
    .jp-split > .jp-table { order: 1; }
    .jp-split > .jp-stats { order: 2; width: 280px; }
  }

  /* ---- generic container-query split: a main panel + a side panel (stats/count/info) ----
     small container → flex column (side stacked); wide container → row with side at right. */
  .cq-split { display: flex; flex-direction: column; gap: 16px; }
  /* `.reverse` puts the side panel (e.g. count card) ON TOP while stacked */
  .cq-split.reverse { flex-direction: column-reverse; }
  .cq-split > .cq-main { flex: 1 1 auto; min-width: 0; }
  .cq-split > .cq-side { flex: none; }
  @container (min-width: 1280px) {
    .cq-split { flex-direction: row; align-items: stretch; }
    .cq-split.reverse { flex-direction: row; }
    .cq-split > .cq-side { width: var(--cq-side-w, 260px); }
  }
  /* responsive stat-tile grid: parent `.cq-stats` is the container, `.cq-stat-grid` is the grid */
  .cq-stats { container-type: inline-size; }
  .cq-stat-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @container (min-width: 520px) { .cq-stat-grid { grid-template-columns: repeat(2, 1fr); } }
  @container (min-width: 820px) { .cq-stat-grid { grid-template-columns: repeat(3, 1fr); } }

  /* ---- Posting detail: applications table + the two info cards as ONE group ----
     keyed off main width (.bh-main). <1280 → the info group sits ON TOP of the table, its two cards
     in a ROW (job-info + count) that collapses to a column-reverse stack (count on top) only once the
     group itself gets small; ≥1280 → row with the group docked RIGHT as a vertical column. */
  .pd-split { display: flex; flex-direction: column-reverse; gap: 16px; }
  .pd-split > .pd-main { flex: 1 1 auto; min-width: 0; }
  .pd-split > .pd-side { flex: none; container-type: inline-size; }
  .pd-cards { display: flex; flex-direction: row; gap: 16px; align-items: stretch; }
  .pd-cards > .card { container-type: inline-size; }
  .pd-cards > .pd-info { flex: 1 1 auto; min-width: 0; }
  .pd-cards > .pd-count { flex: 0 0 220px; }
  /* group narrow → stack with the count on top */
  @container (max-width: 600px) {
    .pd-cards { flex-direction: column-reverse; }
    .pd-cards > .pd-count { flex: none; }
  }
  @container (min-width: 1280px) {
    .pd-split { flex-direction: row; align-items: flex-start; }
    .pd-split > .pd-main { order: 1; }
    .pd-split > .pd-side { order: 2; width: 320px; }
  }
  /* info card inner grid responds to the card's own width: 1 → 2 → 3 up */
  .pd-info-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @container (min-width: 340px) { .pd-info-grid { grid-template-columns: repeat(2, 1fr); } }
  @container (min-width: 520px) { .pd-info-grid { grid-template-columns: repeat(3, 1fr); } }

  /* ---- master-detail split (course player, notifications inbox): left rail + right pane ----
     small main → column (rail on top); wide main → row with the rail on the LEFT at a fixed width. */
  .md-split { display: flex; flex-direction: column; gap: 16px; }
  .md-split > .md-rail { flex: none; min-width: 0; }
  .md-split > .md-main { flex: 1 1 auto; min-width: 0; }
  @container (min-width: 820px) {
    .md-split { flex-direction: row; align-items: flex-start; }
    .md-split > .md-rail { width: var(--md-rail-w, 340px); }
    .md-split > .md-rail.md-rail--sticky { position: sticky; top: 0; align-self: flex-start; }
  }
  /* course player: on small screens the right content opens as a slide-in side drawer */
  .cp-backdrop { position: fixed; inset: 0; background: rgba(16,24,40,.45); z-index: 290; }
  .cp-drawer-close { display: flex; }
  @container (min-width: 820px) { .cp-backdrop { display: none; } .cp-drawer-close { display: none; } }
  @container (max-width: 819px) {
    .md-split > .md-main.cp-drawer { position: fixed; top: 0; right: 0; left: 0; bottom: 0; width: 100%;
      background: var(--gray-75, #f7f8fa); transform: translateX(100%);
      transition: transform .25s ease; z-index: 300; overflow-y: auto; padding: 16px; box-sizing: border-box; }
    .md-split > .md-main.cp-drawer.open { transform: none; }
  }
  .menu-item { display:flex; align-items:center; gap:8px; padding:8px 10px; border:0; background:none;
    border-radius:7px; font-family:var(--font-ui); font-size:13px; font-weight:500; color:var(--gray-700);
    cursor:pointer; text-align:left; white-space:nowrap; }
  .menu-item:hover { background: var(--gray-75); }
  .menu-item.danger { color: var(--error); }
  .menu-item.danger:hover { background: var(--error-tint); }

  /* ---- side-nav sub-menus ---- */
  .bh-sub { position: relative; overflow: hidden; transition: max-height .32s ease, opacity .25s ease; }
  .bh-child { position: relative; display: block; text-decoration: none; padding-left: 16px;
    border-radius: 8px; cursor: pointer; }
  .bh-child .lbl { display: flex; align-items: center; height: 40px; padding-left: 14px;
    border-left: 1px solid rgba(0,0,0,.22); font-family: var(--font-ui); font-weight: 600;
    font-size: 14px; color: var(--brand-ink); transition: border-color .2s; }
  .bh-child:hover { background: rgba(0,0,0,.07); }
  .bh-child.on { background: var(--brand-yellow-dark); }
  .bh-child.on .lbl { border-left-color: rgba(0,0,0,.42); }
  .bh-ind { position: absolute; left: 14px; width: 4px; height: 16px; border-radius: 3px;
    background: rgba(0,0,0,.5); z-index: 2; transition: top .32s cubic-bezier(.4,0,.2,1); }
  @keyframes bhFade { from { opacity:0 } to { opacity:1 } }
  @keyframes bhRise { from { transform:translateY(8px) } to { transform:none } }
  @keyframes bhSlide { from { transform:translateX(12px) } to { transform:none } }
  @keyframes bhDrawer { from { transform:translateX(28px) } to { transform:none } }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:var(--gray-200); border-radius:6px; border:2px solid var(--gray-75); }

  /* profile-picture avatar trigger + crop zoom slider */
  .pp-trigger:hover .pp-trigger-badge { background: var(--brand-yellow-dark); }
  .pp-range { -webkit-appearance:none; appearance:none; height:6px; border-radius:999px; outline:none; cursor:pointer; }
  .pp-range::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:18px; height:18px; border-radius:50%;
    background:var(--brand-yellow); border:2px solid #fff; box-shadow:0 1px 3px rgba(16,24,40,.2); cursor:pointer; }
  .pp-range::-moz-range-thumb { width:18px; height:18px; border-radius:50%; background:var(--brand-yellow);
    border:2px solid #fff; box-shadow:0 1px 3px rgba(16,24,40,.2); cursor:pointer; }

  /* employee-engagement: accommodation grids + chip */
  .bh-chip { display:inline-flex; align-items:center; white-space:nowrap; background:var(--gray-50); border:1px solid var(--border);
    border-radius:999px; padding:3px 10px; font-family:var(--font-ui); font-weight:600; font-size:12px; color:var(--gray-600); }
  .acc-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(248px, 1fr)); gap:16px; }
  .acc-imggrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
</style>
